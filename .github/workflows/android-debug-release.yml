name: Build Android APK

# Every push to main or web builds the debug APK and publishes it as a
# pre-release. Start this workflow manually with build=release to assemble a
# release-signed APK from the repository's signing variables instead.

on:
  push:
    branches: [main, web]
  workflow_dispatch:
    inputs:
      build:
        description: "APK to build and publish"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: assembleDebug and pre-release
    if: github.event_name == 'push' || inputs.build == 'debug'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The debug key is committed at android/app/padanam-debug.p12 and wired
      # up in build.gradle.kts, so updates stay installable over each other.
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish pre-release with debug APK
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.4.5-debug.${{ github.run_number }}
        run: |
          gh release create "$TAG" \
            "android/app/build/outputs/apk/debug/app-debug.apk" \
            --target "$GITHUB_SHA" \
            --title "Padanam debug build ${{ github.run_number }}" \
            --prerelease \
            --notes "Automated debug APK for commit $GITHUB_SHA (workflow run ${{ github.run_number }}). Download app-debug.apk below and install it on your phone; allow installs from unknown sources when Android asks."

  release:
    name: assembleRelease and pre-release
    if: github.event_name == 'workflow_dispatch' && inputs.build == 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The upload keystore is stored as base64 in repository variables and
      # only exists on the runner for the duration of this job. The keytool
      # probe detects JKS vs PKCS12 without needing another variable.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ vars.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ vars.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty. Add it as a repository variable."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          test -s app/release.keystore
          KEYSTORE_TYPE=JKS
          if keytool -list -keystore app/release.keystore \
              -storepass "$KEYSTORE_PASSWORD" -storetype PKCS12 >/dev/null 2>&1; then
            KEYSTORE_TYPE=PKCS12
          fi
          echo "ANDROID_KEYSTORE_TYPE=$KEYSTORE_TYPE" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ vars.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ vars.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Publish pre-release with release APK
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.4.5-release.${{ github.run_number }}
        run: |
          gh release create "$TAG" \
            "android/app/build/outputs/apk/release/app-release.apk" \
            --target "$GITHUB_SHA" \
            --title "Padanam release build ${{ github.run_number }}" \
            --prerelease \
            --notes "Release-signed APK for commit $GITHUB_SHA (workflow run ${{ github.run_number }}). This build uses the upload keystore, not the debug key: if Android reports a signature mismatch, uninstall the debug build first. The account library syncs back after signing in."

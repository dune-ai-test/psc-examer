name: Build debug APK

# Every push to main or web builds the app on a GitHub runner and publishes
# the debug APK straight to a pre-release. No local build is needed.
on:
  push:
    branches: [main, web]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug and pre-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Android refuses an update signed by a different key. Without this,
      # every ephemeral runner generates a fresh debug keystore and the user
      # has to uninstall the previous APK before every install.
      - name: Cache the debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: padanam-debug-keystore-v1

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # No actions/upload-artifact step: the APK goes straight to Releases.
      - name: Publish pre-release with APK
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.4.1-debug.${{ github.run_number }}
        run: |
          gh release create "$TAG" \
            "android/app/build/outputs/apk/debug/app-debug.apk" \
            --target "$GITHUB_SHA" \
            --title "Padanam debug build ${{ github.run_number }}" \
            --prerelease \
            --notes "Automated debug APK for commit $GITHUB_SHA (workflow run ${{ github.run_number }}). Download app-debug.apk below and install it on your phone; allow installs from unknown sources when Android asks."

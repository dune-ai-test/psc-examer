name: Build debug APK

# Manual only. Pushing to any branch no longer starts this workflow.
# Run it from Actions → Build debug APK → Run workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to build"
        required: true
        default: web
        type: string

permissions:
  contents: write

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug and pre-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out the requested branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The debug key is committed at android/app/padanam-debug.p12 and wired
      # up in build.gradle.kts, so updates stay installable over each other.
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish pre-release with debug APK
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA=$(git rev-parse HEAD)
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n1)
          TAG="v${VERSION}-debug.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "android/app/build/outputs/apk/debug/app-debug.apk" \
            --target "$TARGET_SHA" \
            --title "Padanam debug build ${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --notes "Debug APK for Padanam ${VERSION}, commit ${TARGET_SHA} (workflow run ${GITHUB_RUN_NUMBER}). Download app-debug.apk below and install it on your phone; allow installs from unknown sources when Android asks."

name: Build release APK

# Manual only. Run it from Actions → Build release APK → Run workflow.
# Requires the repository variables:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#
# The upload keystore is written only to the ephemeral runner, used to sign
# assembleRelease, and removed before the job finishes.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to build"
        required: true
        default: web
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: assembleRelease and pre-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out the requested branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The keystore probe detects JKS vs PKCS12 without needing another
      # variable. The decoded file is ignored by Git and deleted at the end.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ vars.ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ vars.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty. Add it as a repository variable."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          test -s app/release.keystore
          KEYSTORE_TYPE=JKS
          if keytool -list -keystore app/release.keystore \
              -storepass "$KEYSTORE_PASSWORD" -storetype PKCS12 >/dev/null 2>&1; then
            KEYSTORE_TYPE=PKCS12
          fi
          echo "ANDROID_KEYSTORE_TYPE=$KEYSTORE_TYPE" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ vars.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ vars.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Publish pre-release with release APK
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA=$(git rev-parse HEAD)
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n1)
          TAG="v${VERSION}-release.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "android/app/build/outputs/apk/release/app-release.apk" \
            --target "$TARGET_SHA" \
            --title "Padanam release build ${GITHUB_RUN_NUMBER}" \
            --notes "Release-signed Padanam ${VERSION} APK for commit ${TARGET_SHA} (workflow run ${GITHUB_RUN_NUMBER}). This build uses the upload keystore, not the debug key: if Android reports a signature mismatch, uninstall the existing debug build first. Your library syncs back after signing in."

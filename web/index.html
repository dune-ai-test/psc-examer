<title>Padanam — PSC practice, in your browser</title>
<meta name="description" content="Padanam for the web: scan PSC question papers with Gemini or a custom OpenAI-compatible API, keep a bilingual library, and take practice or timed mock exams. All data stays in your browser.">
<meta name="theme-color" content="#F2F4F9">
<meta name="color-scheme" content="light dark">
<script>
  (function () {
    try {
      var choice = localStorage.getItem('padanam.theme.v1');
      var media = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
      var dark = choice === 'dark' || (choice !== 'light' && media && media.matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', dark ? '#0B0F1A' : '#F2F4F9');
    } catch (err) {}
  })();
</script>

<div class="app-shell" id="appShell">

  <!-- Desktop rail -->
  <aside class="rail" aria-label="Primary">
    <a class="brand" href="#/home">
      <img class="brand-mark" src="assets/logo.svg" alt="" width="36" height="36">
      <span class="brand-copy">
        <strong>Padanam</strong>
        <small>PSC study library</small>
      </span>
    </a>

    <a class="btn btn-primary rail-cta" href="#/scan">
      <svg class="icon" aria-hidden="true"><use href="#i-scan"/></svg>
      Scan a paper
    </a>

    <nav class="rail-nav" aria-label="Sections">
      <p class="rail-label mono">Study</p>
      <a href="#/home" data-nav="home"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>Home</a>
      <a href="#/library" data-nav="library"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg>Library</a>
      <a href="#/progress" data-nav="progress"><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg>Progress</a>
      <p class="rail-label mono">You</p>
      <a href="#/profile" data-nav="profile"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg>Profile</a>
      <a href="#/settings" data-nav="settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>Settings</a>
    </nav>

    <div class="rail-bottom">
      <div class="rail-goal">
        <div class="rail-goal-top">
          <span class="mono">Today’s goal</span>
          <svg class="icon" aria-hidden="true"><use href="#i-flame"/></svg>
        </div>
        <p class="rail-goal-value"><span data-bind="goal-done">0</span><span class="muted"> / <span data-bind="goal-total">20</span></span></p>
        <div class="progress progress--dark"><span data-bind="goal-bar" style="width:0%"></span></div>
        <p class="rail-goal-note" data-bind="goal-note">No questions yet today</p>
      </div>

      <a class="rail-user" href="#/profile">
        <span class="avatar avatar--sm" data-bind="avatar">P</span>
        <span class="rail-user-copy">
          <strong data-bind="user-name">Set up profile</strong>
          <small>Local to this browser</small>
        </span>
        <svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg>
      </a>
    </div>
  </aside>

  <!-- Mobile top bar -->
  <header class="mobile-top">
    <a class="brand" href="#/home">
      <img class="brand-mark" src="assets/logo.svg" alt="" width="32" height="32">
      <span class="brand-copy">
        <strong>Padanam</strong>
      </span>
    </a>
    <div class="mobile-actions">
      <a class="icon-btn" href="#/settings" aria-label="Settings">
        <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
      </a>
      <a class="avatar avatar--sm" href="#/profile" data-bind="avatar" aria-label="Profile">P</a>
    </div>
  </header>

  <div class="app-main">
    <main class="view" id="view" tabindex="-1">
      <div class="boot">
        <img src="assets/logo.svg" alt="" width="46" height="46">
        <p>Opening your library…</p>
      </div>
    </main>
  </div>

  <!-- Mobile tabs -->
  <nav class="tabbar" aria-label="Sections">
    <a href="#/home" data-nav="home"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></a>
    <a href="#/library" data-nav="library"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg><span>Library</span></a>
    <a class="tabbar-scan" href="#/scan" data-nav="scan" aria-label="Scan a paper">
      <span class="tabbar-scan-btn"><svg class="icon" aria-hidden="true"><use href="#i-scan"/></svg></span>
      <span>Scan</span>
    </a>
    <a href="#/progress" data-nav="progress"><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg><span>Progress</span></a>
    <a href="#/profile" data-nav="profile"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg><span>Profile</span></a>
  </nav>
</div>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="false"></div>
<p class="sr-only" id="live" role="status" aria-live="polite"></p>

<noscript>
  <div class="noscript">Padanam is a browser app, so JavaScript needs to be enabled. Your library is stored locally in this browser.</div>
</noscript>

</body>
</html>
